# Ruff 配置：只开两条规则，不追求「全绿」。
#
# 为什么不全套上：本项目有大量**故意的**写法——规则门面 `core/rules.py`
# 只做 re-export、`ui/theme.py` 用 `__getattr__` 造动态属性、模组加载走
# 延迟导入。通用规则会一条条地误报，最后只能靠 noqa 堆过去，
# 而 noqa 一多，真正的信号就没了。
#
# 这两条的价值：
#   F401 未使用导入——纯噪音，会掩盖「这个模块依赖了什么」；
#   E9/F63/F7/F82/F821 —— 语法 / 运行时明显错误，CI 里越早红越好。
#   （后几条原先写在 CI 的命令行里，挪到这里统一维护。）

line-length = 110
target-version = "py310"

[lint]
select = ["F401", "E9", "F63", "F7", "F82", "F821"]

[lint.per-file-ignores]
# 门面：它的全部工作就是 re-export，本身当然「不使用」这些名字
"core/rules.py" = ["F401"]
